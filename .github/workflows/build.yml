name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to 8.9: AGP 8.5.x does not run on Gradle 9.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/apn-release.keystore \
            -alias apn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI APN Connect, O=APN, C=IR"

      - name: Build debug and release
        run: |
          # Actions runs `bash -e`, so failures must be captured instead of aborting.
          set +e
          gradle assembleDebug assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          status=$?

          # Emit one short annotation per interesting line. Long or multi-line
          # messages are rejected by the workflow parser, so they are split up.
          python3 - <<'PYEOF'
          import re
          try:
              lines = open('/tmp/build.log', encoding='utf-8', errors='replace').read().splitlines()
          except Exception as exc:
              lines = ['could not read build log: %s' % exc]
          picked = [l for l in lines
                    if re.match(r'^(e: |error: |> Task .*FAILED|.*What went wrong|.*Could not )', l)]
          if not picked:
              picked = lines[-25:]
          for line in picked[:25]:
              msg = line.strip()[:230].replace('%', '%25').replace('\r', '%0D')
              print('::error file=build.yml,line=1,title=Build failed::' + msg)
          PYEOF

          tail -n 20 /tmp/build.log
          exit $status

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-apn-connect-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk