name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to 8.9: AGP 8.5.x does not run on Gradle 9.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/apn-release.keystore \
            -alias apn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI APN Connect, O=APN, C=IR"

      - name: Build debug and release
        run: |
          # Actions runs `bash -e`, so failures must be captured instead of aborting.
          set +e
          gradle assembleDebug assembleRelease --no-daemon --stacktrace > /tmp/build.log 2>&1
          status=$?

          # Collect the interesting lines so they can be published as an annotation,
          # which stays readable through the API even when job logs are not.
          {
            grep -aE "^e: |error: |ERROR: |FAILURE:|What went wrong|Caused by:|Could not |was not found|A problem occurred|^> " /tmp/build.log \
              | head -30
            echo "----- last 25 lines of build log -----"
            tail -n 25 /tmp/build.log
          } > /tmp/errors.txt

          python3 - <<'PY'
          text = open('/tmp/errors.txt', encoding='utf-8', errors='replace').read()[:6000]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Gradle build failed::' + text)
          PY

          tail -n 30 /tmp/build.log
          exit $status

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-apn-connect-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk