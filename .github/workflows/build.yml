name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/apn-release.keystore \
            -alias apn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI APN Connect, O=APN, C=IR"

      - name: Cache and warm Gradle
        run: |
          gradle wrapper --gradle-version 8.9 --no-daemon
          ./gradlew --version

      - name: Build debug and release
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-apn-connect-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Commit wrapper files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add Gradle wrapper"
            git push || true
          fi