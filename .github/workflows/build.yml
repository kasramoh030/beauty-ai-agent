name: Build APK

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Pinned to 8.9: AGP 8.5.x does not run on Gradle 9.
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/apn-release.keystore \
            -alias apn \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=AI APN Connect, O=APN, C=IR"

      - name: Build debug and release
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error::gradle build failed"
            grep -nE "^e: |error: |FAILURE:|What went wrong|^\* What went wrong|Caused by:|Could not (find|resolve|download)" /tmp/build.log \
              | head -25 | sed 's/^/::error:: /' || true
            exit "$status"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ai-apn-connect-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk